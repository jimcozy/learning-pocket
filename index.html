<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學習口袋助手</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .video-container { position: relative; width: 100%; max-width: 640px; margin: 0 auto; background-color: #000; border-radius: 8px; overflow: hidden; }
    video { width: 100%; height: auto; display: block; }
    .student-card { cursor: pointer; transition: all 0.2s; }
    .student-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .student-card.selected { border: 2px solid #0d6efd; background-color: #e7f1ff; }
  </style>
</head>
<body>
  <div class="container py-3">
    <!-- 頂部標題與控制欄 -->
    <div class="d-flex justify-content-between align-items-center bg-primary text-white p-3 rounded mb-3">
      <h1 class="h4 m-0">📷 學習口袋助手</h1>
      <div class="d-flex align-items-center gap-2">
        <label for="classSelect" class="form-label text-nowrap m-0 fw-bold">選擇班級：</label>
        <select id="classSelect" class="form-select form-select-sm" style="width: 100px;">
          <option value="A班">A班</option>
          <option value="B班">B班</option>
          <option value="C班">C班</option>
        </select>
        <span id="cameraStatus" class="badge bg-success">鏡頭正常</span>
      </div>
    </div>

    <div class="row g-3">
      <!-- 左側相機預覽區 -->
      <div class="col-md-6">
        <div class="video-container shadow-sm mb-3">
          <video id="webcam" autoplay playsinline muted></video>
        </div>
        <div class="d-grid gap-2 d-flex">
          <button id="switchBtn" class="btn btn="btn-primary flex-fill">🔄 切換鏡頭</button>
          <button id="captureBtn" class="btn btn-success flex-fill">📷 1. 拍攝學習單</button>
        </div>
      </div>

      <!-- 右側學生名單選擇區 -->
      <div class="col-md-6">
        <h5 class="fw-bold mb-3">2. 點擊學生姓名歸檔寄出</h5>
        <div id="studentList" class="row g-2 overflow-auto" style="max-height: 480px;">
          <!-- 學生卡片將動態產生於此 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentStream = null;
    let useFacingMode = "user"; // 預設使用前鏡頭
    let studentData = {};
    let selectedStudent = null;

    const webcam = document.getElementById('webcam');
    const classSelect = document.getElementById('classSelect');
    const studentList = document.getElementById('studentList');
    const cameraStatus = document.getElementById('cameraStatus');
    const switchBtn = document.getElementById('switchBtn');

    // 初始化相機（兼顧手機與電腦的彈性設定）
    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      // 相容性極佳的視訊設定，避免手機因為硬鎖 exact 導致失敗
      const constraints = {
        video: {
          facingMode: { ideal: useFacingMode },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcam.srcObject = currentStream;
        cameraStatus.className = "badge bg-success";
        cameraStatus.textContent = "鏡頭正常";
      } catch (err) {
        console.error("相機存取失敗:", err);
        cameraStatus.className = "badge bg-danger";
        cameraStatus.textContent = "鏡頭權限被拒絕";
      }
    }

    // 切換前後鏡頭
    switchBtn.addEventListener('click', () => {
      useFacingMode = (useFacingMode === "user") ? "environment" : "user";
      initCamera();
    });

    // 載入學生資料
    async function loadStudents() {
      try {
        const response = await fetch('students.json');
        studentData = await response.json();
        renderStudents();
      } catch (err) {
        console.error("讀取學生名單失敗:", err);
      }
    }

    // 渲染學生名單
    function renderStudents() {
      const selectedClass = classSelect.value;
      const students = studentData[selectedClass] || [];
      studentList.innerHTML = '';

      students.forEach(student => {
        const col = document.createElement('div');
        col.className = 'col-6';
        col.innerHTML = `
          <div class="card student-card p-3 text-center h-100" data-email="${student.email}">
            <div class="fw-bold fs-5">${student.name}</div>
            <div class="text-muted small text-break">${student.email}</div>
          </div>
        `;

        col.querySelector('.student-card').addEventListener('click', function() {
          document.querySelectorAll('.student-card').forEach(c => c.classList.remove('selected'));
          this.classList.add('selected');
          selectedStudent = student;
        });

        studentList.appendChild(col);
      });
    }

    classSelect.addEventListener('change', renderStudents);

    // 啟動應用程式
    window.addEventListener('load', () => {
      initCamera();
        loadStudents();
    });
  </script>
</body>
</html>
